services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: youtube-automation
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_REQUIRE_CUDA=cuda>=12.0
      - __EGL_VENDOR_LIBRARY_DIRS=/usr/share/glvnd/egl_vendor.d
      - OLLAMA_HOST=http://ollama:11434
    ports:
      - "${WEB_PORT:-7860}:7860"
    volumes:
      - ../workspace:/app/workspace
      - ../models:/app/models
      - ../avatars:/app/avatars
      - ../src:/app/src
    depends_on:
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: youtube-automation-ollama
    runtime: nvidia
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  ollama_data:
