services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: youtube-automation
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_REQUIRE_CUDA=cuda>=12.0
      - __EGL_VENDOR_LIBRARY_DIRS=/usr/share/glvnd/egl_vendor.d
      - OLLAMA_HOST=http://ollama:11434
      # Pass .env settings through to the app (compose only auto-loads .env
      # for interpolation — without these lines the container never sees them)
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - LLM_MODEL=${LLM_MODEL:-llama3:8b}
      - PIPER_VOICE=${PIPER_VOICE:-en_US-lessac-high}
      - RENDER_RESOLUTION_X=${RENDER_RESOLUTION_X:-1920}
      - RENDER_RESOLUTION_Y=${RENDER_RESOLUTION_Y:-1080}
      - RENDER_FPS=${RENDER_FPS:-30}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-}
    ports:
      - "${WEB_PORT:-7860}:7860"
    volumes:
      - ../workspace:/app/workspace
      - ../models:/app/models
      - ../avatars:/app/avatars
      - ../src:/app/src
    depends_on:
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: youtube-automation-ollama
    runtime: nvidia
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  ollama_data:
